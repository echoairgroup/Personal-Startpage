<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-assistent</title><link rel="stylesheet" href="style.css"></head><body data-page="ai"><script src="script.js"></script><script>document.write(shellPage('AI-assistent','INTELLIGENT DASHBOARD','Een centrale assistent die je dashboard kan gebruiken om samen te vatten, plannen te maken en acties voor te bereiden.','',''))</script><div class="ai-layout"><div class="card ai-chat"><div class="card-head"><div><span class="kicker">ASSISTENT</span><h3>Mijn persoonlijke AI</h3></div><span id="aiStatus" class="status-pill">Verbinden…</span></div><div id="aiMessages" class="ai-messages"><div class="ai-message assistant"><strong>AI</strong><p>Hoi! Ik kan je helpen met je planning, taken, huiswerk, doelen en notities. Probeer bijvoorbeeld: “Wat is vandaag belangrijk?”</p></div></div><form id="aiForm" class="ai-input"><textarea id="aiInput" rows="2" placeholder="Vraag iets over je dag…"></textarea><button class="btn primary">Verstuur</button></form></div><div class="ai-side"><div class="card"><span class="kicker">SNELLE ACTIES</span><h3>Wat wil je doen?</h3><div class="ai-actions"><button data-ai-prompt="Geef mij een overzicht van wat vandaag het belangrijkst is.">📌 Wat is belangrijk?</button><button data-ai-prompt="Maak een realistische planning voor vandaag op basis van mijn open taken en afspraken.">🗓️ Plan mijn dag</button><button data-ai-prompt="Welke deadlines komen eraan en welke moet ik eerst doen?">⏰ Deadlines</button><button data-ai-prompt="Geef mij een korte motivatie om mijn belangrijkste taak te starten.">⚡ Start focus</button></div></div><div class="card"><span class="kicker">CONTEXT</span><h3>Dashboardgegevens</h3><div id="aiContext" class="list"></div></div></div></div><div class="toast" id="toast"></div></section></div></main></div></body></html>
