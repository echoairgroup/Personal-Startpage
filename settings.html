<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instellingen</title><link rel="stylesheet" href="style.css"></head><body data-page="settings"><script src="app.js"></script><script>document.write(shellPage('Instellingen','BEHEER','Personaliseer je startpagina en beheer je gegevens.','',''))</script><div class="settings-grid"><div class="card setting"><label>Naam</label><input id="nameSetting" placeholder="Bijvoorbeeld Christian"><small>Deze naam verschijnt in je begroeting.</small></div><div class="card setting"><label>Zoekmachine</label><select id="engineSetting"><option value="https://www.google.com/search?q=">Google</option><option value="https://www.bing.com/search?q=">Bing</option><option value="https://duckduckgo.com/?q=">DuckDuckGo</option></select></div><div class="card setting"><label>Thema</label><div class="segmented"><button data-theme="dark">Donker</button><button data-theme="light">Licht</button><button data-theme="system">Systeem</button></div></div><div class="card setting"><label>Back-up</label><button class="btn" id="exportBtn">Exporteer gegevens</button><small>Je gegevens blijven standaard lokaal in deze browser.</small></div><div class="card setting"><label>Onderhoud</label><button class="btn danger" id="resetBtn">Alles wissen</button><small>Verwijdert alle lokale gegevens en instellingen.</small></div></div><div class="toast" id="toast"></div></section></div></main></div></body></html>
