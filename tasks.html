<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taken</title><link rel="stylesheet" href="style.css"></head><body data-page="tasks"><script src="script.js"></script><script>document.write(shellPage('Taken','PRODUCTIVITEIT','Maak je dag concreet en houd overzicht over wat nog moet.','+ Taak','task'))</script><div class="toolbar"><input id="taskSearch" class="search-inline" placeholder="Zoek taken…"><button class="filter active" data-filter="all">Alles</button><button class="filter" data-filter="open">Open</button><button class="filter" data-filter="done">Afgerond</button></div><div id="tasksList" class="items"></div><div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose">×</button></div><form id="modalForm"></form></div></div><div class="toast" id="toast"></div></section></div></main></div><script>document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.taskFilter=b.dataset.filter;renderTasks()}));</script></body></html>
